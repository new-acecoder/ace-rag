[project]
name = "ace-rag"
version = "0.1.0"
description = "Agentic RAG backend for enterprise knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5,<10",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.3,<1",
    "minio>=7.2,<8",
    "pydantic-settings>=2.8,<3",
    "pymilvus>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5,<7",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
